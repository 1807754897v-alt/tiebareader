name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Global Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-detect and Build
      run: |
        # 既然没有 gradlew，我们就去找安卓核心的 build.gradle 文件所在的位置
        cd $(dirname $(find . -name "build.gradle" | head -n 1))
        
        # 不再使用 ./gradlew，而是直接呼叫系统级别的 gradle 命令强行打包
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/app/build/outputs/apk/debug/**/*.apk"
